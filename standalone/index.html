<!DOCTYPE html>

<head>
    <style>
        @keyframes indeterminate-bar {
            0% {
                left: 0%;
                width: 0;
            }

            50% {
                left: 0%;
                width: 100%;
            }

            100% {
                left: 100%;
                width: 0;
            }
        }

        .progress-container {
            position: relative;
            width: 300px;
            height: 4px;
            margin-top: 40px;
            background-color: rgba(13, 193, 233, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #0DC1E9;
            animation: indeterminate-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
    <script>
        "use strict";
        tizen.tvinputdevice.registerKey("ColorF0Red");
        tizen.tvinputdevice.registerKey("ColorF1Green");
        tizen.tvinputdevice.registerKey("ColorF2Yellow");
        tizen.tvinputdevice.registerKey("ColorF3Blue");

        var keys = [
            "MediaPlayPause",
            "MediaPlay",
            "MediaPause",
            "MediaStop",
            "MediaFastForward",
            "MediaRewind",
            "MediaTrackNext",
            "MediaTrackPrevious"
        ];

        for (var i = 0; i < keys.length; i++) {
            tizen.tvinputdevice.registerKey(keys[i]);
        }

        var pkgId = tizen.application.getCurrentApplication().appInfo.packageId;
        var serviceId = pkgId + ".StandaloneService";

        function getCastArgs() {
            try {
                var data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
                var parsedData = JSON.parse(data[0].value[0]);
                return parsedData.args;
            } catch (e) {
                return undefined;
            }
        }

        var PROXY_URL = "http://localhost:8099";
        var DIAL_URL = "http%3A%2F%2Flocalhost%3A8085%2Fdial%2Fapps%2FYouTube";

        function openYouTube() {
            var args = getCastArgs();
            var target = PROXY_URL + "/tv?additionalDataUrl=" + DIAL_URL + (args ? "&" + args : "");
            fetch(PROXY_URL + "/tizentube/health")
                .then(function (r) {
                    if (r.ok) {
                        location.href = target;
                    } else {
                        setTimeout(openYouTube, 300);
                    }
                })
                .catch(function () {
                    setTimeout(openYouTube, 300);
                });
        }

        tizen.application.launchAppControl(
            new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
            serviceId,
            function () {
                openYouTube();
            },
            function (e) {
                alert("Launch Service failed: " + e.message);
            }
        );
    </script>
</head>

<body
    style="background-color: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <h1
        style="color: #FFFFFF; font-size: 80px; font-family: Roboto,Noto Sans CJK ZH-HK,Noto Sans Thai,Arial,Helvetica,sans-serif; margin: 0;">
        axotube
    </h1>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</body>

</html>
